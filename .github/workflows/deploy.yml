name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress deploy FINISH rather than
# cancelling it. Cancelling deploy-pages mid-flight leaves the Pages backend in a
# broken state and makes the next run fail with "Deployment failed, try again
# later." This matches GitHub's official Pages workflow (cancel-in-progress:
# false). Same build/deploy behaviour — only more reliable under rapid pushes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        run: npx expo export -p web

      - name: GitHub Pages hygiene (SPA fallback + Jekyll + custom domain)
        run: |
          # Static legal pages MUST exist as real files so Google Play's
          # crawler gets a 200 (not the SPA "not found" screen). Expo copies
          # public/ into dist/, but copy explicitly so it never depends on
          # that behaviour. These resolve at:
          #   https://tulipbookings.com/privacy-policy.html
          #   https://tulipbookings.com/account-deletion.html
          cp public/privacy-policy.html dist/privacy-policy.html
          cp public/account-deletion.html dist/account-deletion.html
          # SPA deep-link fallback: serve the app for any unknown path.
          # (Runs AFTER the copies above so it can't shadow the real files.)
          cp dist/index.html dist/404.html
          # Stop Jekyll from stripping the _expo/ folder (would blank the site)
          touch dist/.nojekyll
          # Keep the custom domain bound on every deploy
          echo "tulipbookings.com" > dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
