name: Android Play release (AAB)

# Builds a signed Android App Bundle (.aab) and submits it to Google Play —
# the Android counterpart of "iOS App Store Connect". Expo managed app (no
# committed android/ project), so CI runs `expo prebuild`, then Gradle
# `bundleRelease` signing with the upload keystore, and uploads via the Google
# Play Developer API. Separate from "Android build (APK)" (which produces a
# debug-signed APK for sideload testing only).
#
# Required GitHub config (Settings -> Secrets and variables -> Actions):
#   Secrets:
#     ANDROID_KEYSTORE_BASE64      base64 of the upload keystore (.jks/.keystore)
#     ANDROID_KEYSTORE_PASSWORD    keystore (store) password
#     ANDROID_KEY_ALIAS            key alias inside the keystore
#     ANDROID_KEY_PASSWORD         key password (often same as the store password)
#     PLAY_SERVICE_ACCOUNT_JSON    Google Play service-account JSON (full contents)
#
# The keystore MUST be the upload key registered for com.theesim.app under Play
# App Signing. The service account needs release access to this app in the Play
# Console (Users & permissions -> grant "Release apps to testing tracks" and, for
# production, "Release to production").

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track (start with internal to validate)"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: "Release status (completed = live to the whole track)"
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft
          - inProgress
      user_fraction:
        description: "Staged rollout fraction for status=inProgress (e.g. 0.1). Ignored otherwise."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        run: npm ci

      - name: Set a unique, increasing versionCode
        run: |
          # Google Play requires each upload's versionCode to be strictly higher
          # than the previous one. A unix timestamp is monotonically increasing
          # and fits under Play's 2.1e9 cap (this mirrors the iOS timestamp build
          # number). Patch app.json BEFORE prebuild so Expo writes it into the
          # native project. Ephemeral — not committed.
          VC=$(date +%s)
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.android=j.expo.android||{};j.expo.android.versionCode=$VC;fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('versionCode set to '+$VC);"

      - name: Expo prebuild (generate native Android project)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"

      - name: Decode upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed AAB
        run: |
          cd android
          chmod +x ./gradlew
          # android.injected.signing.* overrides the buildType's default (debug)
          # signing with the real upload key for this build only — no edits to the
          # Expo-generated Gradle files.
          ./gradlew bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Resolve AAB path
        id: aab
        run: |
          AAB="$(find android/app/build/outputs/bundle -name '*.aab' | head -n1)"
          if [ -z "$AAB" ]; then
            echo "No AAB found"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          echo "Built AAB: $AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: tulip-android-aab
          path: ${{ steps.aab.outputs.path }}

      - name: Submit to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.theesim.app
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          userFraction: ${{ inputs.status == 'inProgress' && inputs.user_fraction || '' }}
          # Stage the release rather than auto-sending it for review. The Play
          # API refuses to auto-submit when other changes are pending review
          # (e.g. a Data safety edit), and staging lets you review + submit
          # everything together from Play Console → Publishing overview →
          # "Send changes for review". One extra click, but robust.
          changesNotSentForReview: true
