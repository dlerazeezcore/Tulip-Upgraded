name: Android build (APK)

# Builds an installable Android APK for testing. Expo managed app (no committed
# android/ project), so CI runs `expo prebuild` to generate it, then Gradle.
#
# The release APK is signed with the auto-generated debug key, which is fine for
# sideload testing (download the artifact and install on any Android device).
# For Google Play distribution we'd add a real upload keystore + AAB later.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Gradle build type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        run: npm ci

      - name: Expo prebuild (generate native Android project)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"

      - name: Gradle build
        run: |
          cd android
          chmod +x ./gradlew
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Resolve APK path
        id: apk
        run: |
          APK="$(find android/app/build/outputs/apk -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "No APK found"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: tulip-android-apk
          path: ${{ steps.apk.outputs.path }}
